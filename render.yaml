services:
  - type: web
    name: ocean-rag-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: QDRANT_URL          
        sync: false
      - key: QDRANT_API_KEY      
        sync: false
      - key: QDRANT_COLLECTION
        value: conhecimento_maritimo
      - key: MCP_AUTH_TOKEN     
        generateValue: true
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false